name: Daily packaging SEO drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "35 4 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check requests google-genai

      - name: Run SEO engine smoke tests
        run: python -m unittest discover -s tests -v

      - name: Generate SEO drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python scripts/generate_seo_batch.py

      - name: Save local staging drafts as workflow artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seo-staging-drafts
          path: seo_staging/
          if-no-files-found: warn
          retention-days: 14
